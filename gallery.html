<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gallery — Light Research</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      --label-font: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;
    }

    body {
      font-family: Georgia, 'Times New Roman', serif;
      background: #f5f5f0;
      min-height: 100vh;
      color: #333;
    }

    .container {
      max-width: 42rem;
      margin: 0 auto;
      padding: 24px 20px 60px;
      background: #fffef9;
      min-height: 100vh;
    }

    .page-header {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 12px;
      font-family: var(--label-font);
      font-size: 11px;
      font-weight: normal;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: #999;
      padding-bottom: 8px;
      border-bottom: 2px dotted #ddd;
    }

    .page-header h1 {
      font: inherit;
      color: inherit;
    }

    .back-link {
      font: inherit;
      color: #aaa;
      text-decoration: none;
    }

    .back-link:hover {
      color: #666;
    }

    .status {
      padding: 20px 0;
      font-size: 13px;
      color: #999;
    }

    .status--empty {
      font-style: italic;
    }

    .status--error {
      color: #c00;
      font-style: normal;
    }

    .gallery-list {
      list-style: none;
    }

    .gallery-row {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 10px 0;
      border-bottom: 1px solid #ddd;
      font-family: var(--label-font);
      font-size: 11px;
      letter-spacing: 0.04em;
    }

    .gallery-row-type {
      width: 4.5rem;
      flex-shrink: 0;
      color: #aaa;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .gallery-row-date {
      color: #bbb;
    }

    .gallery-row-link {
      margin-left: auto;
      flex-shrink: 0;
      color: #aaa;
      text-decoration: none;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .gallery-row-link:hover {
      color: #666;
    }
  </style>
</head>
<body>
  <div class="container">
    <header class="page-header">
      <h1>Published</h1>
      <a href="/" class="back-link">← app</a>
    </header>

    <div id="content">
      <div class="status">Loading...</div>
    </div>
  </div>

  <script>
    function formatDate(iso) {
      return new Date(iso).toLocaleDateString('en-US', {
        year: 'numeric',
        month: 'short',
        day: 'numeric',
      });
    }

    async function loadGallery() {
      const content = document.getElementById('content');

      if (window.location.protocol === 'file:') {
        content.innerHTML = '<div class="status status--error">This page needs to be served from a web server.<br><br>Use Live Server in VS Code or visit the deployed site.</div>';
        return;
      }

      try {
        const res = await fetch('/api/list');
        const data = await res.json();

        if (!res.ok) {
          throw new Error(data.error || 'Failed to load');
        }

        if (!data.items || data.items.length === 0) {
          content.innerHTML = '<div class="status status--empty">Nothing published yet.</div>';
          return;
        }

        const list = document.createElement('ul');
        list.className = 'gallery-list';

        data.items.forEach((item) => {
          const row = document.createElement('li');
          row.className = 'gallery-row';

          const type = document.createElement('span');
          type.className = 'gallery-row-type';
          type.textContent = item.type === 'map' ? 'map' : 'outline';

          const date = document.createElement('span');
          date.className = 'gallery-row-date';
          date.textContent = formatDate(item.uploadedAt);

          const link = document.createElement('a');
          link.className = 'gallery-row-link';
          link.href = '/p/' + item.id;
          link.target = '_blank';
          link.rel = 'noopener';
          link.textContent = 'open ↗';

          row.appendChild(type);
          row.appendChild(date);
          row.appendChild(link);
          list.appendChild(row);
        });

        content.innerHTML = '';
        content.appendChild(list);
      } catch (err) {
        content.innerHTML = '<div class="status status--error">Failed to load gallery: ' + err.message + '</div>';
      }
    }

    loadGallery();
  </script>
</body>
</html>
