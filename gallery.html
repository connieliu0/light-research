<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gallery — Light Research</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Georgia, 'Times New Roman', serif;
      background: #f5f5f0;
      min-height: 100vh;
      color: #333;
    }

    .container {
      max-width: 900px;
      margin: 0 auto;
      padding: 40px 24px;
    }

    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 32px;
      padding-bottom: 16px;
      border-bottom: 2px dotted #ccc;
    }

    h1 {
      font-size: 14px;
      font-weight: normal;
      text-transform: uppercase;
      letter-spacing: 1.5px;
      color: #888;
    }

    .back-link {
      font-size: 14px;
      color: #888;
      text-decoration: none;
    }

    .back-link:hover {
      color: #555;
      text-decoration: underline;
    }

    .loading {
      text-align: center;
      padding: 60px 20px;
      color: #999;
      font-style: italic;
    }

    .error {
      text-align: center;
      padding: 60px 20px;
      color: #c00;
    }

    .empty {
      text-align: center;
      padding: 60px 20px;
      color: #999;
      font-style: italic;
    }

    .gallery {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 20px;
    }

    .gallery-item {
      background: #fffef9;
      border: 1px solid #ddd;
      padding: 20px;
      transition: border-color 0.15s, box-shadow 0.15s;
    }

    .gallery-item:hover {
      border-color: #bbb;
      box-shadow: 0 2px 8px rgba(0,0,0,0.06);
    }

    .gallery-item-preview {
      width: 100%;
      height: 160px;
      border: 1px solid #eee;
      margin-bottom: 14px;
      background: #fff;
    }

    .gallery-item-meta {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    .gallery-item-date {
      font-size: 12px;
      color: #999;
    }

    .gallery-item-link {
      font-size: 13px;
      color: #666;
      text-decoration: none;
    }

    .gallery-item-link:hover {
      text-decoration: underline;
    }

    .gallery-item-type {
      font-size: 10px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: #aaa;
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1>Published Gallery</h1>
      <a href="/" class="back-link">← Back to app</a>
    </header>

    <div id="content">
      <div class="loading">Loading gallery...</div>
    </div>
  </div>

  <script>
    async function loadGallery() {
      const content = document.getElementById('content');
      
      // Check if opened from file:// protocol
      if (window.location.protocol === 'file:') {
        content.innerHTML = '<div class="error">This page needs to be served from a web server.<br><br>Please use Live Server in VS Code or visit the deployed site.</div>';
        return;
      }
      
      try {
        const res = await fetch('/api/list');
        const data = await res.json();
        
        if (!res.ok) {
          throw new Error(data.error || 'Failed to load');
        }

        if (!data.items || data.items.length === 0) {
          content.innerHTML = '<div class="empty">Nothing published yet.</div>';
          return;
        }

        const gallery = document.createElement('div');
        gallery.className = 'gallery';

        data.items.forEach(item => {
          const card = document.createElement('div');
          card.className = 'gallery-item';

          const previewUrl = `/p/${item.id}`;
          
          const iframe = document.createElement('iframe');
          iframe.className = 'gallery-item-preview';
          iframe.src = previewUrl;
          iframe.setAttribute('loading', 'lazy');
          iframe.setAttribute('sandbox', 'allow-same-origin');
          card.appendChild(iframe);

          const meta = document.createElement('div');
          meta.className = 'gallery-item-meta';

          const type = document.createElement('span');
          type.className = 'gallery-item-type';
          type.textContent = item.type === 'map' ? 'Map' : 'Outline';
          meta.appendChild(type);

          const date = document.createElement('span');
          date.className = 'gallery-item-date';
          date.textContent = new Date(item.uploadedAt).toLocaleDateString('en-US', {
            year: 'numeric',
            month: 'short',
            day: 'numeric',
          });
          meta.appendChild(date);

          const link = document.createElement('a');
          link.className = 'gallery-item-link';
          link.href = previewUrl;
          link.target = '_blank';
          link.textContent = 'Open →';
          meta.appendChild(link);

          card.appendChild(meta);

          gallery.appendChild(card);
        });

        content.innerHTML = '';
        content.appendChild(gallery);

      } catch (err) {
        content.innerHTML = '<div class="error">Failed to load gallery: ' + err.message + '</div>';
      }
    }

    loadGallery();
  </script>
</body>
</html>
