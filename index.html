<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Light Research
  </title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Georgia, 'Times New Roman', serif;
      height: 100vh;
      overflow: hidden;
      background: #f5f5f0;
    }

    .container {
      display: flex;
      height: 100vh;
    }

    .panel {
      padding-top: 24px;
      padding-bottom: 60px;
      overflow-y: auto;
      background: #fffef9;
    }

    .left-panel {
      flex: 1;
      border-right: 0.5px dashed #ccc;
    }

    .middle-panel {
      width: 0;
      overflow: hidden;
      transition: width 0.2s ease, padding 0.2s ease;
      border-right: 0.5px dashed #ccc;
      padding: 0;
    }

    .middle-panel > * {
      opacity: 0;
      transition: opacity 0.1s ease;
    }

    .middle-panel.expanded {
      width: 260px;
      padding-top: 24px;
    }

    .middle-panel.expanded > * {
      opacity: 1;
    }

    .right-panel {
      width: 280px;
      display: flex;
      flex-direction: column;
    }

    #refs-container {
      flex: 1;
      overflow-y: auto;
    }

    .right-panel-actions {
      margin-top: auto;
      padding: 16px 20px 20px;
    }

    .panel-title {
      display: flex;
      flex-direction: row;
      font-size: 11px;
      font-weight: normal;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: #999;
      padding: 0 20px 8px;
      border-bottom: 2px dotted #ddd;
    }

    /* Text Lines */
    .line {
      padding: 7.4px 6px;
      border-bottom: 1px solid #ddd;
      cursor: text;
      position: relative;
      display: flex;
      align-items: center;
      min-height: 36px;
    }

    .line:hover {
      background: rgba(0,0,0,0.02);
    }

    .line.selected {
      background: transparent;
    }

    .line.indented {
      padding-left: calc(var(--indent-offset, 0px) + 6px);
    }

    .line.indented::before {
      content: '';
      position: absolute;
      left: 26px;
      top: 0;
      bottom: 0;
      border-left: 1px dotted #c6c6c6;
    }

    .line.indented .line-text {
      padding-left: 0 !important;
    }

    .line.drop-attach {
      background: rgba(0,0,0,0.03);
    }

    .line.drop-attach::after {
      content: '+ attach';
      position: absolute;
      right: 24px;
      font-size: 10px;
      color: #666;
      font-style: italic;
    }

    .line.drop-insert {
      border-bottom: 1px solid #666;
    }

    .line.drop-insert::after {
      content: '+ insert below';
      position: absolute;
      bottom: -14px;
      left: 0;
      font-size: 10px;
      color: #666;
      font-style: italic;
    }

    .line-handle {
      cursor: grab;
      color: #ccc;
      font-size: 14px;
      flex-shrink: 0;
      margin-right: 6px;
      opacity: 0;
      transition: opacity 0.15s;
      user-select: none;
    }

    .line:hover .line-handle {
      opacity: 1;
    }

    .line-handle:active {
      cursor: grabbing;
    }

    .line-text {
      flex: 1;
      outline: none;
      font-size: 14px;
      line-height: 1.5;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .line:hover .line-text,
    .line.selected .line-text,
    .line-text:focus {
      white-space: normal;
      overflow: visible;
      text-overflow: unset;
    }

    .line-text:empty:before {
      content: '...';
      color: #ccc;
      font-style: italic;
    }

    .line-refs-indicator {
      font-size: 10px;
      color: #a3a3a3;
      margin-left: 8px;
      flex-shrink: 0;
    }

    .line-delete {
      border: none;
      background: none;
      cursor: pointer;
      font-size: 14px;
      color: #ccc;
      margin-left: 4px;
      flex-shrink: 0;
      transition: color 0.15s;
      opacity: 0;
    }

    .line:hover .line-delete {
      opacity: 1;
    }

    .line-delete:hover {
      color: #c00;
    }

    .add-line-btn {
      padding: 10px 20px;
      color: #999;
      cursor: pointer;
      font-size: 14px;
      font-style: italic;
    }

    .add-line-btn:hover {
      color: #666;
    }

    /* References */
    .reference {
      padding: 8px 20px;
      border-bottom: 1px solid #ddd;
      cursor: grab;
      position: relative;
      display: flex;
      align-items: flex-start;
      gap: 8px;
    }

    .reference:hover {
      background: rgba(0,0,0,0.02);
    }

    .reference-delete {
      border: none;
      background: none;
      cursor: pointer;
      font-size: 14px;
      color: #ccc;
      flex-shrink: 0;
      transition: color 0.15s;
      opacity: 0;
    }

    .reference:hover .reference-delete {
      opacity: 1;
    }

    .reference-delete:hover {
      color: #c00;
    }

    .reference.dragging {
      opacity: 0.5;
    }

    .reference-content {
      flex: 1;
      min-width: 0;
      font-size: 14px;
      line-height: 1.4;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .reference:hover .reference-content {
      white-space: normal;
      overflow: hidden;
      overflow: visible;
    }

    .reference-type {
      font-size: 10px;
      color: #aaa;
      flex-shrink: 0;
    }

    .reference-image {
      max-width: 100%;
      max-height: 60px;
      border-radius: 2px;
    }

    .reference:hover .reference-image {
      max-height: none;
    }

    .reference-url {
      color: #666;
      text-decoration: none;
      font-size: 14px;
    }

    .reference-url:hover {
      text-decoration: underline;
    }

    /* Middle panel refs */
    .attached-ref {
      padding: 10px 20px;
      border-bottom: 1px solid #ddd;
      font-size: 14px;
      position: relative;
      display: flex;
      align-items: flex-start;
      gap: 8px;
    }

    .attached-ref-content {
      flex: 1;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .attached-ref:hover .attached-ref-content:not(.attached-ref-content--url) {
      white-space: normal;
      overflow: hidden;
    }

    .attached-ref-delete {
      border: none;
      background: none;
      cursor: pointer;
      font-size: 14px;
      color: #ccc;
      flex-shrink: 0;
      transition: color 0.15s;
      opacity: 0;
    }

    .attached-ref:hover .attached-ref-delete {
      opacity: 1;
    }

    .attached-ref-delete:hover {
      color: #c00;
    }

    /* Actions */
    .paste-area {
      padding: 14px;
      border: 1px dashed #ccc;
      text-align: center;
      color: #999;
      font-size: 14px;
      margin-bottom: 16px;
      cursor: pointer;
      font-style: italic;
    }

    .paste-area:hover, .paste-area.dragover {
      border-color: #888;
      background: rgba(0,0,0,0.02);
    }

    .action-btn {
      display: block;
      width: fit-content;
      height: fit-content;
      padding: 8px;
      margin-top: 8px;
      background: none;
      border: 2px dotted #ccc;
      cursor: pointer;
      font-size: 14px;
      font-style: italic;
      color: #888;
    }

    .action-btn:hover {
      border-color: #888;
      color: #666;
    }

    .action-btn-row {
      display: flex;
      gap: 8px;
      margin-top: 8px;
    }

    .action-btn-row .action-btn {
      flex: 1;
      margin-top: 0;
    }

    /* Inline reference in text */
    .inline-ref {
      background: rgba(100,149,237,0.15);
      padding: 1px 3px;
      border-radius: 2px;
      color: inherit;
    }

    /* Tabs */
    .tab-bar {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      display: flex;
      background: #fffef9;
      border-top: 2px dotted #ccc;
      padding: 0 20px;
    }

    .tab {
      padding: 10px 20px;
      cursor: pointer;
      font-size: 14px;
      color: #666;
      border-right: 2px dotted #ccc;
      position: relative;
    }

    .tab:hover {
      color: #333;
    }

    .tab.active {
      color: #666;
    }

    .tab-add {
      padding: 10px 16px;
      cursor: pointer;
      font-size: 14px;
      color: #aaa;
    }

    .tab-add:hover {
      color: #333;
    }

    .tab-add.disabled {
      color: #ddd;
      cursor: default;
    }

    /* Arena import modal */
    .modal-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.3);
      z-index: 100;
      align-items: center;
      justify-content: center;
    }

    .modal-overlay.visible {
      display: flex;
    }

    .modal {
      background: #fffef9;
      padding: 24px;
      border: 1px solid #ccc;
      width: 360px;
      max-width: 90%;
    }

    .modal h3 {
      margin-bottom: 16px;
      font-weight: normal;
      font-size: 16px;
    }

    .modal input {
      width: 100%;
      padding: 8px;
      border: 1px solid #ccc;
      font-size: 14px;
      margin-bottom: 14px;
      font-family: inherit;
    }

    .modal-actions {
      display: flex;
      gap: 8px;
      justify-content: flex-end;
    }

    .modal-actions button {
      padding: 6px 14px;
      border: 1px solid #ccc;
      background: none;
      cursor: pointer;
      font-size: 14px;
      font-family: inherit;
    }

    .modal-actions .confirm {
      background: #333;
      color: #fff;
      border-color: #333;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="panel left-panel">
      <div class="panel-title">Text</div>
      <div id="lines-container"></div>
      <div class="add-line-btn" onclick="addLine()">+ Add line</div>
    </div>

    <div class="panel middle-panel" id="middle-panel">
      <div class="panel-title" id="middle-panel-title">Attached References</div>
      <div id="attached-refs"></div>
    </div>

    <div class="panel right-panel">
      <div class="panel-title">
        <span>Unsorted</span>
        <span style="display:flex; gap:8px; margin-left:auto;">
          <button onclick="exportData()" title="Export backup" style="background:none;border:none;cursor:pointer;font-size:11px;color:#aaa;padding:0;font-family:inherit;line-height:1;">↓</button>
          <button onclick="document.getElementById('import-input').click()" title="Import backup" style="background:none;border:none;cursor:pointer;font-size:11px;color:#aaa;padding:0;font-family:inherit;line-height:1;">↑</button>
          <button onclick="showArenaModal()" style="background:none;border:none;cursor:pointer;font-size:11px;color:#aaa;padding:0;font-family:inherit;line-height:1;">**</button>
          <button onclick="clearAllReferences()" style="background:none;border:none;cursor:pointer;font-size:11px;color:#aaa;padding:0;font-family:inherit;line-height:1;">Ø</button>
        </span>
        <input type="file" id="import-input" accept=".json" style="display:none" onchange="importData(event)">
      </div>
      <div id="add-ref-btn" class="add-line-btn" style="border-bottom: 2px dotted #ddd;" onclick="showRefInput()">+ Add reference</div>
      <input id="add-ref-input" type="text" placeholder="Type or paste a reference..." style="display:none; width:100%; padding:8px 20px; border:none; border-bottom:2px dotted #ddd; outline:none; font-family:inherit; font-size:14px; color:#333; background:none; box-sizing:border-box;">
      <div id="refs-container"></div>
     
    </div>
  </div>

  <div class="tab-bar" id="tab-bar"></div>

  <div class="modal-overlay" id="arena-modal">
    <div class="modal">
      <h3>Import from Are.na</h3>
      <input type="text" id="arena-channel" placeholder="Channel slug (e.g., my-channel-name)">
      <div class="modal-actions">
        <button class="cancel" onclick="hideArenaModal()">Cancel</button>
        <button class="confirm" onclick="importArena()">Import</button>
      </div>
    </div>
  </div>

  <script>
    // IndexedDB setup
    const DB_NAME = 'textRefsDB';
    const DB_VERSION = 1;
    let db;

    function initDB() {
      return new Promise((resolve, reject) => {
        const request = indexedDB.open(DB_NAME, DB_VERSION);

        request.onerror = () => reject(request.error);
        request.onsuccess = () => {
          db = request.result;
          resolve(db);
        };

        request.onupgradeneeded = (e) => {
          const database = e.target.result;
          if (!database.objectStoreNames.contains('data')) {
            database.createObjectStore('data', { keyPath: 'id' });
          }
        };
      });
    }

    async function saveData() {
      const tx = db.transaction('data', 'readwrite');
      const store = tx.objectStore('data');
      await store.put({ id: 'sessions', sessions: sessions, currentSessionIndex: currentSessionIndex });
    }

    async function loadData() {
      return new Promise((resolve) => {
        const tx = db.transaction('data', 'readonly');
        const store = tx.objectStore('data');
        const request = store.get('sessions');
        request.onsuccess = () => {
          if (request.result && request.result.sessions) {
            resolve(request.result);
          } else {
            // Migrate old data or create new
            const oldRequest = store.get('main');
            oldRequest.onsuccess = () => {
              if (oldRequest.result) {
                resolve({
                  sessions: [{ name: 'Session 1', lines: oldRequest.result.lines || [], references: oldRequest.result.references || [] }],
                  currentSessionIndex: 0
                });
              } else {
                resolve({ sessions: [{ name: 'Session 1', lines: [], references: [] }], currentSessionIndex: 0 });
              }
            };
            oldRequest.onerror = () => resolve({ sessions: [{ name: 'Session 1', lines: [], references: [] }], currentSessionIndex: 0 });
          }
        };
        request.onerror = () => resolve({ sessions: [{ name: 'Session 1', lines: [], references: [] }], currentSessionIndex: 0 });
      });
    }

    // Undo stack
    const undoStack = [];
    const MAX_UNDO = 50;

    function pushUndo() {
      undoStack.push(JSON.stringify({ sessions, currentSessionIndex }));
      if (undoStack.length > MAX_UNDO) undoStack.shift();
    }

    function undo() {
      if (!undoStack.length) return;
      const state = JSON.parse(undoStack.pop());
      sessions = state.sessions;
      currentSessionIndex = state.currentSessionIndex;
      selectedLineId = null;
      document.getElementById('middle-panel').classList.remove('expanded');
      saveData();
      renderTabs();
      renderLines();
      renderReferences();
    }

    document.addEventListener('keydown', (e) => {
      if ((e.ctrlKey || e.metaKey) && e.key === 'z') {
        if (document.activeElement.contentEditable === 'true') return;
        e.preventDefault();
        undo();
      }
    });

    // App State
    const MAX_SESSIONS = 2;
    let sessions = [];
    let currentSessionIndex = 0;

    function getCurrentSession() {
      return sessions[currentSessionIndex] || { lines: [], references: [] };
    }

    function uuid() {
      return crypto.randomUUID();
    }

    function cleanLinePrefix(text) {
      // Remove common list prefixes: "- ", "* ", "1. ", "2) ", etc.
      return text.replace(/^(\s*[-*•]\s*|\s*\d+[.)]\s*)/, '');
    }

    let selectedLineId = null;

    // Rendering
    function renderLines() {
      const container = document.getElementById('lines-container');
      container.innerHTML = '';
      const session = getCurrentSession();

      session.lines.forEach(line => {
        const div = document.createElement('div');
        const indent = line.indent || 0;
        div.className = 'line' + (line.id === selectedLineId ? ' selected' : '') + (indent > 0 ? ' indented' : '');
        div.dataset.lineId = line.id;
        if (indent > 0) div.style.setProperty('--indent-offset', (indent * 24) + 'px');

        const handle = document.createElement('div');
        handle.className = 'line-handle';
        handle.textContent = '⠿';
        handle.draggable = true;
        handle.ondragstart = (e) => {
          e.dataTransfer.setData('application/line-id', line.id);
          e.stopPropagation();
          setTimeout(() => div.style.opacity = '0.4', 0);
        };
        handle.ondragend = () => { div.style.opacity = ''; };
        div.appendChild(handle);

        const textDiv = document.createElement('div');
        textDiv.className = 'line-text';
        textDiv.contentEditable = true;
        textDiv.innerHTML = line.text;
        textDiv.style.paddingLeft = '0px';
        textDiv.style.paddingLeft = ((line.indent || 0) * 24) + 'px';
        textDiv.oninput = () => {
          line.text = textDiv.innerHTML;
          saveData();
        };
        textDiv.onkeydown = (e) => {
          if (e.key === 'Enter' && !e.shiftKey) {
            e.preventDefault();
            pushUndo();
            const idx = getCurrentSession().lines.findIndex(l => l.id === line.id);
            const newLine = {
              id: uuid(),
              text: '',
              indent: line.indent || 0,
              referenceIds: []
            };
            getCurrentSession().lines.splice(idx + 1, 0, newLine);
            saveData();
            renderLines();
            // Focus the new line
            setTimeout(() => {
              const allLines = document.querySelectorAll('.line-text');
              if (allLines[idx + 1]) {
                allLines[idx + 1].focus();
              }
            }, 10);
          } else if (e.key === 'Tab') {
            e.preventDefault();
            pushUndo();
            if (e.shiftKey) {
              line.indent = Math.max(0, (line.indent || 0) - 1);
            } else {
              line.indent = Math.min(6, (line.indent || 0) + 1);
            }
            if (line.indent > 0) {
              div.classList.add('indented');
              div.style.setProperty('--indent-offset', (line.indent * 24) + 'px');
            } else {
              div.classList.remove('indented');
              div.style.removeProperty('--indent-offset');
            }
            saveData();
          }
        };
        textDiv.onpaste = (e) => {
          const text = e.clipboardData.getData('text');
          const lines = text.split(/\r?\n/).filter(l => l.trim()).map(cleanLinePrefix);

          if (lines.length > 1) {
            e.preventDefault();
            e.stopPropagation();
            pushUndo();
            const idx = getCurrentSession().lines.findIndex(l => l.id === line.id);

            // Put first line in current text box
            line.text = (line.text || '') + lines[0];

            // Create new lines for the rest
            const newLines = lines.slice(1).map(text => ({
              id: uuid(),
              text: text,
              referenceIds: []
            }));

            getCurrentSession().lines.splice(idx + 1, 0, ...newLines);
            saveData();
            renderLines();

            // Focus the last new line
            setTimeout(() => {
              const allLines = document.querySelectorAll('.line-text');
              if (allLines[idx + newLines.length]) {
                allLines[idx + newLines.length].focus();
              }
            }, 10);
          }
        };

        div.appendChild(textDiv);

        if (line.referenceIds && line.referenceIds.length > 0) {
          const indicator = document.createElement('span');
          indicator.className = 'line-refs-indicator';
          indicator.textContent = line.referenceIds.length + ' ref' + (line.referenceIds.length > 1 ? 's' : '');
          div.appendChild(indicator);
        }

        const deleteBtn = document.createElement('button');
        deleteBtn.className = 'line-delete';
        deleteBtn.textContent = '×';
        deleteBtn.onclick = (e) => {
          e.stopPropagation();
          deleteLine(line.id);
        };
        div.appendChild(deleteBtn);

        // Click to select and show refs
        div.onclick = (e) => {
          if (e.target.classList.contains('line-text')) return;
          selectLine(line.id);
        };
        textDiv.onclick = () => {
          selectLine(line.id, true);
        };

        // Drop zones
        div.ondragover = (e) => {
          e.preventDefault();
          div.classList.remove('drop-attach', 'drop-insert');
          if (e.dataTransfer.types.includes('application/line-id')) {
            div.classList.add('drop-insert');
          } else {
            const rect = div.getBoundingClientRect();
            const midY = rect.top + rect.height / 2;
            if (e.clientY < midY) {
              div.classList.add('drop-attach');
            } else {
              div.classList.add('drop-insert');
            }
          }
        };

        div.ondragleave = () => {
          div.classList.remove('drop-attach', 'drop-insert');
        };

        div.ondrop = (e) => {
          e.preventDefault();
          div.classList.remove('drop-attach', 'drop-insert');

          const reorderId = e.dataTransfer.getData('application/line-id');
          if (reorderId && reorderId !== line.id) {
            const session = getCurrentSession();
            const fromIdx = session.lines.findIndex(l => l.id === reorderId);
            const [moved] = session.lines.splice(fromIdx, 1);
            const toIdx = session.lines.findIndex(l => l.id === line.id);
            session.lines.splice(toIdx + 1, 0, moved);
            saveData();
            renderLines();
            return;
          }

          const refId = e.dataTransfer.getData('text/plain');
          if (!refId) return;

          const rect = div.getBoundingClientRect();
          const midY = rect.top + rect.height / 2;

          if (e.clientY < midY) {
            // Top half: attach reference to this line (keep in pool so it can be looked up)
            if (!line.referenceIds) line.referenceIds = [];
            if (!line.referenceIds.includes(refId)) {
              line.referenceIds.push(refId);
            }
          } else {
            // Bottom half: insert as new line below and remove from pool
            const ref = getCurrentSession().references.find(r => r.id === refId);
            if (ref) {
              const newLine = {
                id: uuid(),
                text: formatRefAsText(ref),
                referenceIds: [refId]
              };
              const idx = getCurrentSession().lines.findIndex(l => l.id === line.id);
              getCurrentSession().lines.splice(idx + 1, 0, newLine);
            }
            getCurrentSession().references = getCurrentSession().references.filter(r => r.id !== refId);
          }

          saveData();
          renderLines();
          renderReferences();
          if (selectedLineId === line.id) {
            renderAttachedRefs();
          }
        };

        container.appendChild(div);
      });
    }

    function formatRefAsText(ref) {
      if (ref.type === 'url') {
        return `<a href="${ref.content}" class="inline-ref" target="_blank">${ref.content}</a>`;
      } else if (ref.type === 'image') {
        return `<span class="inline-ref">[image]</span>`;
      }
      return ref.content;
    }

    function renderReferences() {
      const container = document.getElementById('refs-container');
      container.innerHTML = '';

      const attachedIds = new Set();
      getCurrentSession().lines.forEach(line => {
        (line.referenceIds || []).forEach(id => attachedIds.add(id));
      });

      getCurrentSession().references.filter(ref => !attachedIds.has(ref.id)).forEach(ref => {
        const div = document.createElement('div');
        div.className = 'reference';
        div.dataset.refId = ref.id;
        div.draggable = true;
        const contentDiv = document.createElement('div');
        contentDiv.className = 'reference-content';

        if (ref.type === 'image') {
          const img = document.createElement('img');
          img.src = ref.content;
          img.className = 'reference-image';
          contentDiv.appendChild(img);
        } else if (ref.type === 'url') {
          const a = document.createElement('a');
          a.href = ref.content;
          a.className = 'reference-url';
          a.textContent = ref.content;
          a.target = '_blank';
          a.onclick = (e) => e.stopPropagation();
          contentDiv.appendChild(a);
        } else {
          contentDiv.textContent = ref.content;
        }
        div.appendChild(contentDiv);

        const deleteBtn = document.createElement('button');
        deleteBtn.className = 'reference-delete';
        deleteBtn.textContent = '×';
        deleteBtn.onclick = (e) => {
          e.stopPropagation();
          deleteReference(ref.id);
        };
        div.appendChild(deleteBtn);

        div.ondragstart = (e) => {
          e.dataTransfer.setData('text/plain', ref.id);
          div.classList.add('dragging');
        };

        div.ondragend = () => {
          div.classList.remove('dragging');
        };

        container.appendChild(div);
      });
    }

    function renderAttachedRefs() {
      const container = document.getElementById('attached-refs');
      const title = document.getElementById('middle-panel-title');
      container.innerHTML = '';

      const line = getCurrentSession().lines.find(l => l.id === selectedLineId);
      if (!line || !line.referenceIds || line.referenceIds.length === 0) {
        title.style.display = 'none';
        return;
      }
      title.style.display = '';

      line.referenceIds.forEach(refId => {
        const ref = getCurrentSession().references.find(r => r.id === refId);
        if (!ref) return;

        const div = document.createElement('div');
        div.className = 'attached-ref';
        div.draggable = true;
        div.ondragstart = (e) => {
          e.dataTransfer.setData('application/attached-ref', JSON.stringify({ refId, lineId: line.id }));
          setTimeout(() => div.style.opacity = '0.4', 0);
        };
        div.ondragend = () => { div.style.opacity = ''; };

        const contentDiv = document.createElement('div');
        contentDiv.className = 'attached-ref-content';

        if (ref.type === 'image') {
          contentDiv.innerHTML = `<img src="${ref.content}" class="reference-image">`;
        } else if (ref.type === 'url') {
          contentDiv.classList.add('attached-ref-content--url');
          contentDiv.innerHTML = `<a href="${ref.content}" target="_blank" class="reference-url">${ref.content}</a>`;
        } else {
          contentDiv.textContent = ref.content;
        }
        div.appendChild(contentDiv);

        const deleteBtn = document.createElement('button');
        deleteBtn.className = 'attached-ref-delete';
        deleteBtn.textContent = '×';
        deleteBtn.onclick = (e) => {
          e.stopPropagation();
          detachReference(line.id, refId);
        };
        div.appendChild(deleteBtn);

        container.appendChild(div);
      });
    }

    function detachReference(lineId, refId) {
      const line = getCurrentSession().lines.find(l => l.id === lineId);
      if (line && line.referenceIds) {
        line.referenceIds = line.referenceIds.filter(id => id !== refId);
      }
      saveData();
      renderLines();
      renderAttachedRefs();
    }

    function insertRefIntoLine(lineId, ref) {
      const line = getCurrentSession().lines.find(l => l.id === lineId);
      if (!line) return;

      const insertion = formatRefAsText(ref);
      line.text = line.text + ' ' + insertion;
      saveData();
      renderLines();
    }

    function selectLine(lineId, preserveFocus = false) {
      const changed = selectedLineId !== lineId;
      selectedLineId = lineId;

      if (changed) {
        // Update selection classes without full re-render if preserving focus
        if (preserveFocus && lineId) {
          document.querySelectorAll('.line').forEach(el => {
            el.classList.toggle('selected', el.dataset.lineId === lineId);
          });
        } else {
          renderLines();
        }
      }

      const middlePanel = document.getElementById('middle-panel');
      const line = getCurrentSession().lines.find(l => l.id === lineId);
      const hasRefs = line && line.referenceIds && line.referenceIds.length > 0;

      if (lineId && hasRefs) {
        middlePanel.classList.add('expanded');
        renderAttachedRefs();
      } else {
        middlePanel.classList.remove('expanded');
      }
    }

    // Actions
    function addLine() {
      pushUndo();
      const newLine = {
        id: uuid(),
        text: '',
        referenceIds: []
      };
      getCurrentSession().lines.push(newLine);
      saveData();
      renderLines();

      // Focus the new line
      setTimeout(() => {
        const lines = document.querySelectorAll('.line-text');
        if (lines.length > 0) {
          lines[lines.length - 1].focus();
        }
      }, 10);
    }

    function showRefInput() {
      const btn = document.getElementById('add-ref-btn');
      const input = document.getElementById('add-ref-input');
      btn.style.display = 'none';
      input.style.display = 'block';
      input.value = '';
      input.focus();
    }

    function hideRefInput() {
      const btn = document.getElementById('add-ref-btn');
      const input = document.getElementById('add-ref-input');
      input.style.display = 'none';
      btn.style.display = '';
    }

    document.addEventListener('DOMContentLoaded', () => {
      const input = document.getElementById('add-ref-input');
      let submitted = false;
      input.onkeydown = (e) => {
        if (e.key === 'Enter') {
          submitted = true;
          const val = input.value.trim();
          if (val) addReference(val, detectRefType(val));
          hideRefInput();
        } else if (e.key === 'Escape') {
          submitted = true;
          hideRefInput();
        }
      };
      input.onblur = () => {
        if (submitted) { submitted = false; return; }
        const val = input.value.trim();
        if (val) addReference(val, detectRefType(val));
        hideRefInput();
      };
    });

    function addReference(content, type = 'text') {
      pushUndo();
      const newRef = {
        id: uuid(),
        content: content,
        type: type
      };
      getCurrentSession().references.unshift(newRef);
      saveData();
      renderReferences();
    }

    function deleteReference(refId) {
      pushUndo();
      // Remove from references array
      getCurrentSession().references = getCurrentSession().references.filter(r => r.id !== refId);
      // Remove from all lines' referenceIds
      getCurrentSession().lines.forEach(line => {
        if (line.referenceIds) {
          line.referenceIds = line.referenceIds.filter(id => id !== refId);
        }
      });
      saveData();
      renderReferences();
      renderLines();
      if (selectedLineId) {
        renderAttachedRefs();
      }
    }

    function clearAllReferences() {
      if (!getCurrentSession().references.length) return;
      if (!confirm('Clear all references from the pile?')) return;
      pushUndo();
      getCurrentSession().references = [];
      getCurrentSession().lines.forEach(line => {
        if (line.referenceIds) line.referenceIds = [];
      });
      saveData();
      renderReferences();
      renderLines();
      if (selectedLineId) renderAttachedRefs();
    }

    function deleteLine(lineId) {
      pushUndo();
      getCurrentSession().lines = getCurrentSession().lines.filter(l => l.id !== lineId);
      if (selectedLineId === lineId) {
        selectedLineId = null;
        document.getElementById('middle-panel').classList.remove('expanded');
      }
      saveData();
      renderLines();
    }

    function detectRefType(content) {
      if (/^https?:\/\/.+\.(jpg|jpeg|png|gif|webp|svg)(\?.*)?$/i.test(content)) {
        return 'image';
      }
      if (/^https?:\/\//i.test(content)) {
        return 'url';
      }
      return 'text';
    }

    // Paste handling
    function handlePasteClick() {
      navigator.clipboard.readText().then(text => {
        if (text && text.trim()) {
          const type = detectRefType(text.trim());
          addReference(text.trim(), type);
        }
      }).catch(() => {});
    }

    // Paste area drag/drop for files
    const pasteArea = document.getElementById('paste-area');
    if (pasteArea) {
    pasteArea.ondragover = (e) => {
      e.preventDefault();
      pasteArea.classList.add('dragover');
    };
    pasteArea.ondragleave = () => {
      pasteArea.classList.remove('dragover');
    };
    pasteArea.ondrop = (e) => {
      e.preventDefault();
      pasteArea.classList.remove('dragover');

      const text = e.dataTransfer.getData('text');
      if (text) {
        const type = detectRefType(text.trim());
        addReference(text.trim(), type);
        return;
      }

      // Handle files
      const files = e.dataTransfer.files;
      for (const file of files) {
        if (file.type.startsWith('image/')) {
          const reader = new FileReader();
          reader.onload = (evt) => {
            addReference(evt.target.result, 'image');
          };
          reader.readAsDataURL(file);
        }
      }
    };
    } // end if (pasteArea)

    // Global paste handler
    document.addEventListener('paste', (e) => {
      // Only handle if not focused on editable or the ref input
      if (document.activeElement.contentEditable === 'true') return;
      if (document.activeElement.id === 'add-ref-input') return;

      const text = e.clipboardData.getData('text');
      if (text) {
        const type = detectRefType(text.trim());
        addReference(text.trim(), type);
        return;
      }

      const files = e.clipboardData.files;
      for (const file of files) {
        if (file.type.startsWith('image/')) {
          const reader = new FileReader();
          reader.onload = (evt) => {
            addReference(evt.target.result, 'image');
          };
          reader.readAsDataURL(file);
        }
      }
    });

    // Are.na import
    function showArenaModal() {
      document.getElementById('arena-modal').classList.add('visible');
      document.getElementById('arena-channel').focus();
    }

    function hideArenaModal() {
      document.getElementById('arena-modal').classList.remove('visible');
      document.getElementById('arena-channel').value = '';
    }

    async function importArena() {
      const channelInput = document.getElementById('arena-channel');
      const slug = channelInput.value.trim();
      if (!slug) return;

      const confirmBtn = document.querySelector('#arena-modal .confirm');
      confirmBtn.textContent = 'Importing...';
      confirmBtn.disabled = true;

      try {
        const response = await fetch(`https://api.are.na/v2/channels/${slug}?per=100`);
        if (!response.ok) throw new Error('Channel not found');

        const data = await response.json();
        const blocks = data.contents || [];

        for (const block of blocks) {
          let content, type;

          if (block.class === 'Channel') {
            continue;
          } else if (block.class === 'Image') {
            content = block.image?.display?.url || block.image?.original?.url;
            type = 'image';
          } else if (block.class === 'Link') {
            content = block.source?.url || block.title;
            type = 'url';
          } else if (block.class === 'Text') {
            content = block.content;
            type = 'text';
          } else if (block.class === 'Attachment') {
            content = block.attachment?.url || block.title;
            type = 'url';
          } else {
            content = block.title || block.content || 'Unknown block';
            type = 'text';
          }

          if (content) {
            addReference(content, type);
          }
        }

        hideArenaModal();
      } catch (err) {
        alert('Error importing channel: ' + err.message);
      } finally {
        confirmBtn.textContent = 'Import';
        confirmBtn.disabled = false;
      }
    }

    // Handle Enter in arena input
    document.getElementById('arena-channel').addEventListener('keydown', (e) => {
      if (e.key === 'Enter') {
        importArena();
      } else if (e.key === 'Escape') {
        hideArenaModal();
      }
    });

    // Click outside to deselect line
    document.querySelector('.left-panel').addEventListener('click', (e) => {
      if (e.target.classList.contains('left-panel')) {
        selectLine(null);
      }
    });

    // Paste multi-line content into left panel
    document.querySelector('.left-panel').addEventListener('paste', (e) => {
      // Only handle if not focused on a text line
      if (document.activeElement.classList.contains('line-text')) return;

      const text = e.clipboardData.getData('text');
      if (!text) return;

      e.preventDefault();
      e.stopPropagation();
      pushUndo();
      const lines = text.split(/\r?\n/).filter(l => l.trim()).map(cleanLinePrefix);

      const newLines = lines.map(text => ({
        id: uuid(),
        text: text,
        referenceIds: []
      }));

      getCurrentSession().lines.push(...newLines);
      saveData();
      renderLines();
    });

    // Tabs
    function renameSession(idx, tabEl) {
      const session = sessions[idx];
      const input = document.createElement('input');
      input.type = 'text';
      input.value = session.name;
      input.style.cssText = 'border:none;outline:none;background:transparent;font-size:14px;font-family:inherit;color:inherit;width:100%;padding:0;';
      tabEl.textContent = '';
      tabEl.appendChild(input);
      input.focus();
      input.select();

      function commit() {
        const val = input.value.trim();
        if (val) session.name = val;
        saveData();
        renderTabs();
      }

      input.onblur = commit;
      input.onkeydown = (e) => {
        if (e.key === 'Enter') { input.blur(); }
        else if (e.key === 'Escape') { input.value = session.name; input.blur(); }
        e.stopPropagation();
      };
    }

    function renderTabs() {
      const tabBar = document.getElementById('tab-bar');
      tabBar.innerHTML = '';

      sessions.forEach((session, idx) => {
        const tab = document.createElement('div');
        tab.className = 'tab' + (idx === currentSessionIndex ? ' active' : '');
        tab.textContent = session.name;
        tab.onclick = () => switchSession(idx);
        tab.ondblclick = (e) => { e.stopPropagation(); renameSession(idx, tab); };
        tabBar.appendChild(tab);
      });

      if (sessions.length < MAX_SESSIONS) {
        const addTab = document.createElement('div');
        addTab.className = 'tab-add';
        addTab.textContent = '+';
        addTab.onclick = addSession;
        tabBar.appendChild(addTab);
      }
    }

    function switchSession(idx) {
      if (idx === currentSessionIndex) return;
      currentSessionIndex = idx;
      selectedLineId = null;
      document.getElementById('middle-panel').classList.remove('expanded');
      saveData();
      renderTabs();
      renderLines();
      renderReferences();
    }

    function addSession() {
      if (sessions.length >= MAX_SESSIONS) return;
      const newSession = {
        name: 'Session ' + (sessions.length + 1),
        lines: [],
        references: []
      };
      sessions.push(newSession);
      currentSessionIndex = sessions.length - 1;
      selectedLineId = null;
      document.getElementById('middle-panel').classList.remove('expanded');
      saveData();
      renderTabs();
      renderLines();
      renderReferences();
    }

    // Refs container drop target (for dragging attached refs back to pile)
    document.getElementById('refs-container').addEventListener('dragover', (e) => {
      if (e.dataTransfer.types.includes('application/attached-ref')) {
        e.preventDefault();
      }
    });

    document.getElementById('refs-container').addEventListener('drop', (e) => {
      const data = e.dataTransfer.getData('application/attached-ref');
      if (!data) return;
      e.preventDefault();
      const { refId, lineId } = JSON.parse(data);
      // Detach from line
      const line = getCurrentSession().lines.find(l => l.id === lineId);
      if (line && line.referenceIds) {
        line.referenceIds = line.referenceIds.filter(id => id !== refId);
      }
      saveData();
      renderLines();
      renderReferences();
      renderAttachedRefs();
    });

    // Export / Import
    function exportData() {
      const blob = new Blob([JSON.stringify({ sessions }, null, 2)], { type: 'application/json' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = 'light-research-backup-' + new Date().toISOString().slice(0, 10) + '.json';
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(url);
    }

    function importData(e) {
      const file = e.target.files[0];
      e.target.value = '';
      if (!file) return;
      const reader = new FileReader();
      reader.onload = async (evt) => {
        try {
          const data = JSON.parse(evt.target.result);
          if (!data.sessions || !Array.isArray(data.sessions)) throw new Error('Invalid backup file');
          if (!confirm('This will replace all current sessions with the backup. Continue?')) return;
          sessions = data.sessions;
          currentSessionIndex = 0;
          selectedLineId = null;
          document.getElementById('middle-panel').classList.remove('expanded');
          await saveData();
          renderTabs();
          renderLines();
          renderReferences();
        } catch (err) {
          alert('Could not import: ' + err.message);
        }
      };
      reader.readAsText(file);
    }

    // Init
    async function init() {
      await initDB();
      const data = await loadData();
      sessions = data.sessions;
      currentSessionIndex = data.currentSessionIndex || 0;
      renderTabs();
      renderLines();
      renderReferences();
    }

    init();
  </script>
</body>
</html>
